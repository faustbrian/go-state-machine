schema_version: 1
tool_version: v2.4.0
tool_checksums_sha256: 875e5592e9fbea713c492d9e6979202e1d6bf687f52f55654e3e72c192963273

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

coverage:
  modules:
    - module: .
      mode: evidence

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v2.txt

operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: ["."]
        run: '^TestCompiledMachineSupportsConcurrentTransitions$'
        race: true
        count: 1
        timeout: 1m
      - type: go-test
        packages: ["./memory"]
        run: '^TestStorePreventsLostUpdatesUnderContention$'
        race: true
        count: 1
        timeout: 1m
      - type: go-test
        packages: ["./runner"]
        run: '^TestRunnerSupportsConcurrentIndependentExecutions$'
        race: true
        count: 1
        timeout: 1m
  - module: .
    gate: benchmark
    steps:
      - type: make
        makefile: verification/package.mk
        target: benchmark
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzSerializedEvent$'
        budget: 2s
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzSerializedDefinition$'
        budget: 2s
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzSerializedContext$'
        budget: 2s
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzSerializedHistory$'
        budget: 2s
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzSerializedSnapshot$'
        budget: 2s
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzSerializedGraphImport$'
        budget: 2s
        count: 1
        timeout: 2m
